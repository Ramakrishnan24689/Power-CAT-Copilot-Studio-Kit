# ============================================================================
# Template: Share Code Apps
# Description: Reusable step template that shares Code Apps in a Power Platform
#              environment with specified users and/or security groups.
#              Call this template AFTER importing a solution that contains Code Apps.
#
# Usage:
#   - template: share-code-apps-template.yml
#     parameters:
#       environmentURL: 'https://org.crm.dynamics.com/'
#       clientId: '$(SpnClientId)'
#       clientSecret: '$(SpnClientSecret)'
#       tenantId: '$(SpnTenantId)'
#       shareWithUsers: 'objectId1,objectId2'           # Optional
#       shareWithSecurityGroups: 'groupObjectId1'       # Optional
#
# Prerequisites:
#   - Service Principal must have System Administrator role in target environment
#   - SPN credentials stored in pipeline variable group or Azure Key Vault
#   - Users/Groups must be specified as Azure AD Object IDs (GUIDs)
#
# Microsoft Docs References:
#   - Set-AdminPowerAppRoleAssignment: https://learn.microsoft.com/powershell/module/microsoft.powerapps.administration.powershell/set-adminpowerapproleassignment
#   - Share a canvas app: https://learn.microsoft.com/power-apps/maker/canvas-apps/share-app
# ============================================================================

parameters:
  - name: environmentURL
    type: string
    displayName: 'Target Environment URL'

  - name: clientId
    type: string
    displayName: 'Service Principal Client/Application ID'

  - name: clientSecret
    type: string
    displayName: 'Service Principal Client Secret'

  - name: tenantId
    type: string
    displayName: 'Azure AD Tenant ID'

  - name: shareWithUsers
    type: string
    displayName: 'User Object IDs (comma-separated, optional)'
    default: 'NA'

  - name: shareWithSecurityGroups
    type: string
    displayName: 'Security Group Object IDs (comma-separated, optional)'
    default: 'NA'

steps:
# ============================================================================
# Share Code Apps with specified users and security groups
# ============================================================================
- powershell: |
    $ErrorActionPreference = 'Stop'
    $ProgressPreference = 'SilentlyContinue'
    # Must set at Global scope — Microsoft.Graph sub-modules register thousands
    # of functions when Set-AdminPowerAppRoleAssignment triggers lazy loading
    $Global:MaximumFunctionCount = 32768

    $shareWithUsers = ($env:SHARE_WITH_USERS).Trim()
    $shareWithSecurityGroups = ($env:SHARE_WITH_SECURITY_GROUPS).Trim()
    $envUrl = ($env:ENVIRONMENT_URL).TrimEnd('/')

    # Treat 'NA' sentinel value as empty (used to make Azure DevOps parameters optional in UI)
    if ($shareWithUsers -eq 'NA') { $shareWithUsers = '' }
    if ($shareWithSecurityGroups -eq 'NA') { $shareWithSecurityGroups = '' }

    # -------------------------------------------------------------------
    # Skip if no sharing targets are specified
    # -------------------------------------------------------------------
    if ([string]::IsNullOrWhiteSpace($shareWithUsers) -and [string]::IsNullOrWhiteSpace($shareWithSecurityGroups)) {
        Write-Host "##[section]No sharing targets specified. Skipping Code App sharing step."
        Write-Host "To share Code Apps, provide 'shareWithUsers' and/or 'shareWithSecurityGroups' parameter values."
        exit 0
    }

    Write-Host "##[section]Starting Code App Sharing Process"
    Write-Host "Environment URL: $envUrl"

    # -------------------------------------------------------------------
    # Helper: Validate GUID format
    # -------------------------------------------------------------------
    function Test-IsGuid {
        param([string]$Value)
        $guid = [guid]::Empty
        return [guid]::TryParse($Value, [ref]$guid)
    }

    # -------------------------------------------------------------------
    # Step 1: Install Power Apps Administration PowerShell module
    # -------------------------------------------------------------------
    Write-Host "##[group]Installing PowerApps Admin Module"
    Install-Module -Name Microsoft.PowerApps.Administration.PowerShell -Force -AllowClobber -Scope CurrentUser -ErrorAction Stop
    Import-Module Microsoft.PowerApps.Administration.PowerShell -Force -ErrorAction Stop
    Write-Host "##[endgroup]"

    # -------------------------------------------------------------------
    # Step 2: Authenticate using Service Principal credentials
    # -------------------------------------------------------------------
    Write-Host "##[group]Authenticating with Service Principal"

    $clientId = $env:SPN_CLIENT_ID
    $clientSecret = $env:SPN_CLIENT_SECRET
    $tenantId = $env:SPN_TENANT_ID

    # Treat 'NA' sentinel value as empty
    if ($clientId -eq 'NA') { $clientId = '' }
    if ($clientSecret -eq 'NA') { $clientSecret = '' }
    if ($tenantId -eq 'NA') { $tenantId = '' }

    if ([string]::IsNullOrWhiteSpace($clientId) -or
        [string]::IsNullOrWhiteSpace($clientSecret) -or
        [string]::IsNullOrWhiteSpace($tenantId)) {
        Write-Host "##vso[task.logissue type=error]Missing SPN credentials. Ensure clientId, clientSecret, and tenantId parameters are provided (from variable group or Key Vault)."
        exit 1
    }

    Add-PowerAppsAccount -ApplicationId $clientId -ClientSecret $clientSecret -TenantId $tenantId

    Write-Host "Successfully authenticated as Service Principal (ClientId: $clientId)"
    Write-Host "##[endgroup]"

    # -------------------------------------------------------------------
    # Step 3: Get Power Platform Environment ID via Global Discovery Service
    # -------------------------------------------------------------------
    Write-Host "##[group]Resolving Environment"

    # Get OAuth token for Global Discovery Service
    $discoTokenBody = @{
        grant_type    = "client_credentials"
        client_id     = $clientId
        client_secret = $clientSecret
        scope         = "https://globaldisco.crm.dynamics.com/.default"
    }
    $discoTokenResponse = Invoke-RestMethod -Method Post `
        -Uri "https://login.microsoftonline.com/$tenantId/oauth2/v2.0/token" `
        -ContentType "application/x-www-form-urlencoded" `
        -Body $discoTokenBody `
        -ErrorAction Stop

    $discoHeaders = @{ Authorization = "Bearer $($discoTokenResponse.access_token)" }

    # Query Global Discovery Service for all instances the SPN can access
    $discoResponse = Invoke-RestMethod -Method Get `
        -Uri "https://globaldisco.crm.dynamics.com/api/discovery/v2.0/Instances?`$select=ApiUrl,EnvironmentId,FriendlyName,Url,UniqueName,IsUserSysAdmin" `
        -Headers $discoHeaders `
        -ErrorAction Stop

    if (-not $discoResponse.value -or $discoResponse.value.Count -eq 0) {
        Write-Host "##vso[task.logissue type=error]Global Discovery Service returned no instances for this SPN."
        Write-Host "##[endgroup]"
        exit 1
    }

    # Match by environment URL (compare hostname only for robustness)
    function Get-NormalizedHost {
        param([string]$Url)
        if ([string]::IsNullOrWhiteSpace($Url)) { return '' }
        try {
            $uri = [Uri]($Url.Trim().TrimEnd('/'))
            return $uri.Host.ToLowerInvariant()
        } catch { return $Url.Trim().ToLowerInvariant() }
    }

    $targetHost = Get-NormalizedHost $envUrl
    $matchedInstances = @($discoResponse.value | Where-Object {
        (Get-NormalizedHost $_.Url) -eq $targetHost -or
        (Get-NormalizedHost $_.ApiUrl) -eq $targetHost
    })

    if ($matchedInstances.Count -eq 0) {
        Write-Host "##vso[task.logissue type=error]Could not find environment matching URL: $envUrl"
        Write-Host "Available instances from Global Discovery:"
        $discoResponse.value | ForEach-Object {
            Write-Host "  $($_.FriendlyName) | URL: $($_.Url) | EnvironmentId: $($_.EnvironmentId)"
        }
        Write-Host "##[endgroup]"
        exit 1
    }

    if ($matchedInstances.Count -gt 1) {
        Write-Host "##vso[task.logissue type=error]Multiple environments matched URL: $envUrl"
        $matchedInstances | ForEach-Object {
            Write-Host "  $($_.FriendlyName) | URL: $($_.Url) | EnvironmentId: $($_.EnvironmentId)"
        }
        Write-Host "##[endgroup]"
        exit 1
    }

    $targetInstance = $matchedInstances[0]
    # Use EnvironmentId, not Id. Id is the Dataverse OrganizationId.
    $environmentId = $targetInstance.EnvironmentId
    Write-Host "Environment: $($targetInstance.FriendlyName)"
    Write-Host "Environment ID: $environmentId"
    Write-Host "IsUserSysAdmin: $($targetInstance.IsUserSysAdmin)"
    Write-Host "##[endgroup]"

    # -------------------------------------------------------------------
    # Step 4: Find Code Apps
    # -------------------------------------------------------------------
    Write-Host "##[group]Discovering Code Apps"

    $allApps = Get-AdminPowerApp -EnvironmentName $environmentId -ErrorAction Stop

    # Filter by display name for the known Code Apps
    $codeApps = @($allApps | Where-Object {
        $_.DisplayName -eq "Copilot Studio Kit for Admins" -or
        $_.DisplayName -eq "Copilot Studio Kit for Makers"
    })

    # Validate both expected apps are found
    $expectedAppNames = @("Copilot Studio Kit for Admins", "Copilot Studio Kit for Makers")
    $missingApps = $expectedAppNames | Where-Object {
        $name = $_
        -not ($codeApps | Where-Object { $_.DisplayName -eq $name })
    }
    if ($missingApps.Count -gt 0) {
        Write-Host "##vso[task.logissue type=warning]Missing expected Code App(s): $($missingApps -join ', ')"
    }

    if ($codeApps.Count -eq 0) {
        Write-Host "##vso[task.logissue type=error]No Code Apps found in environment."
        Write-Host "Available apps:"
        $allApps | ForEach-Object { Write-Host "  - $($_.DisplayName) (ID: $($_.AppName))" }
        Write-Host "##[endgroup]"
        exit 1
    }

    Write-Host "Found $($codeApps.Count) Code App(s):"
    $codeApps | ForEach-Object { Write-Host "  - $($_.DisplayName) (AppId: $($_.AppName))" }
    Write-Host "##[endgroup]"

    # -------------------------------------------------------------------
    # Step 5: Share Code Apps with Users
    # -------------------------------------------------------------------
    $failedAssignments = 0

    if (-not [string]::IsNullOrWhiteSpace($shareWithUsers)) {
        Write-Host "##[group]Sharing with Users"
        $userIds = $shareWithUsers -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' }

        foreach ($userId in $userIds) {
            if (-not (Test-IsGuid $userId)) {
                Write-Host "##vso[task.logissue type=error]Invalid User Object ID (not a GUID): '$userId'"
                $failedAssignments++
                continue
            }
        }

        $validUserIds = $userIds | Where-Object { Test-IsGuid $_ }

        foreach ($app in $codeApps) {
            foreach ($userId in $validUserIds) {
                Write-Host "  Sharing '$($app.DisplayName)' with user: $userId"
                try {
                    Set-AdminPowerAppRoleAssignment `
                        -PrincipalType User `
                        -PrincipalObjectId $userId `
                        -RoleName CanEdit `
                        -AppName $app.AppName `
                        -EnvironmentName $environmentId `
                        -ErrorAction Stop
                    Write-Host "    ✓ Successfully shared"
                }
                catch {
                    $failedAssignments++
                    Write-Host "##vso[task.logissue type=error]Failed to share '$($app.DisplayName)' with user $userId : $($_.Exception.Message)"
                }
            }
        }
        Write-Host "##[endgroup]"
    }

    # -------------------------------------------------------------------
    # Step 6: Share Code Apps with Security Groups
    # -------------------------------------------------------------------
    if (-not [string]::IsNullOrWhiteSpace($shareWithSecurityGroups)) {
        Write-Host "##[group]Sharing with Security Groups"
        $groupIds = $shareWithSecurityGroups -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' }

        foreach ($groupId in $groupIds) {
            if (-not (Test-IsGuid $groupId)) {
                Write-Host "##vso[task.logissue type=error]Invalid Security Group Object ID (not a GUID): '$groupId'"
                $failedAssignments++
                continue
            }
        }

        $validGroupIds = $groupIds | Where-Object { Test-IsGuid $_ }

        foreach ($app in $codeApps) {
            foreach ($groupId in $validGroupIds) {
                Write-Host "  Sharing '$($app.DisplayName)' with group: $groupId"
                try {
                    Set-AdminPowerAppRoleAssignment `
                        -PrincipalType Group `
                        -PrincipalObjectId $groupId `
                        -RoleName CanEdit `
                        -AppName $app.AppName `
                        -EnvironmentName $environmentId `
                        -ErrorAction Stop
                    Write-Host "    ✓ Successfully shared"
                }
                catch {
                    $failedAssignments++
                    Write-Host "##vso[task.logissue type=error]Failed to share '$($app.DisplayName)' with group $groupId : $($_.Exception.Message)"
                }
            }
        }
        Write-Host "##[endgroup]"
    }

    # -------------------------------------------------------------------
    # Final status
    # -------------------------------------------------------------------
    if ($failedAssignments -gt 0) {
        Write-Host "##vso[task.logissue type=error]$failedAssignments sharing assignment(s) failed. Review errors above."
        exit 1
    }

    Write-Host "##[section]Code App sharing complete! All assignments succeeded."
  displayName: 'Share Code Apps with Users/Groups'
  env:
    SHARE_WITH_USERS: ${{ parameters.shareWithUsers }}
    SHARE_WITH_SECURITY_GROUPS: ${{ parameters.shareWithSecurityGroups }}
    ENVIRONMENT_URL: ${{ parameters.environmentURL }}
    SPN_CLIENT_ID: ${{ parameters.clientId }}
    SPN_CLIENT_SECRET: ${{ parameters.clientSecret }}
    SPN_TENANT_ID: ${{ parameters.tenantId }}
