# ============================================================================
# Pipeline: CopilotStudioKit-Deploy
# Description: Deploy Power Platform solution to target environment
# ============================================================================

trigger: none  # Manual trigger only

pool:
  vmImage: windows-latest

# ============================================================================
# Pipeline Resource: Reference the Export-Commit pipeline
# ============================================================================
resources:
  pipelines:
    - pipeline: ExportPipeline
      source: CopilotStudioKit-Export-Commit
      trigger: none  # Manual deployment

variables:
  # Pipeline variables (set in Azure DevOps pipeline UI):
  # - varTargetEnvironmentURL: Target environment URL (e.g., https://org-test.crm.dynamics.com/)
  # - varTargetServiceConnection: Service connection name for target (e.g., PowerPlatform-TEST)
  # - varSolutionName: Unique name of the solution to deploy
  # - varSolutionType: 'managed' or 'unmanaged'
  
  # Internal variables
  DownloadPath: $(Pipeline.Workspace)/ExportPipeline/drop

stages:
- stage: Deploy
  displayName: 'Deploy Solution to Target'
  jobs:
  - job: DeployJob
    displayName: 'Deploy Solution'
    steps:
    
    # ============================================================================
    # Step 1: Download artifacts from Export-Commit pipeline
    # ============================================================================
    - download: ExportPipeline
      artifact: drop
      displayName: 'Download Solution Artifacts'
    
    # ============================================================================
    # Step 2: Install Power Platform Build Tools
    # ============================================================================
    - task: PowerPlatformToolInstaller@2
      displayName: 'Install Power Platform Build Tools'
    
    # ============================================================================
    # Step 3: Determine Solution File Path
    # ============================================================================
    - powershell: |
        $solutionType = "$(varSolutionType)".ToLower()
        $solutionName = "$(varSolutionName)"
        
        if ($solutionType -eq "managed") {
            $solutionFile = "$(DownloadPath)/${solutionName}_managed.zip"
            Write-Host "##[section]Deploying MANAGED solution: $solutionFile"
        }
        elseif ($solutionType -eq "unmanaged") {
            $solutionFile = "$(DownloadPath)/${solutionName}.zip"
            Write-Host "##[section]Deploying UNMANAGED solution: $solutionFile"
        }
        else {
            Write-Host "##vso[task.logissue type=error]Invalid varSolutionType. Must be 'managed' or 'unmanaged'"
            exit 1
        }
        
        # Verify file exists
        if (-not (Test-Path $solutionFile)) {
            Write-Host "##vso[task.logissue type=error]Solution file not found: $solutionFile"
            exit 1
        }
        
        Write-Host "##vso[task.setvariable variable=SolutionFilePath]$solutionFile"
        Write-Host "Solution file validated: $solutionFile"
      displayName: 'Determine Solution File Path'
    
    # ============================================================================
    # Step 4: Import Solution to Target Environment
    # ============================================================================
    - task: PowerPlatformImportSolution@2
      displayName: 'Import Solution ($(varSolutionType))'
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varTargetServiceConnection)'
        Environment: '$(varTargetEnvironmentURL)'
        SolutionInputFile: '$(SolutionFilePath)'
        AsyncOperation: true
        MaxAsyncWaitTime: 60
        UseDeploymentSettingsFile: false
        OverwriteUnmanagedCustomizations: false
        SkipProductUpdateDependencies: false
        ConvertToManaged: false
        HoldingSolution: false
    
    # ============================================================================
    # Step 5: Publish Customizations (Unmanaged Only)
    # ============================================================================
    - task: PowerPlatformPublishCustomizations@2
      displayName: 'Publish Customizations'
      condition: eq(variables['varSolutionType'], 'unmanaged')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varTargetServiceConnection)'
        Environment: '$(varTargetEnvironmentURL)'
    
    # ============================================================================
    # Step 6: Deployment Summary
    # ============================================================================
    - powershell: |
        Write-Host "============================================"
        Write-Host "DEPLOYMENT COMPLETED SUCCESSFULLY"
        Write-Host "============================================"
        Write-Host "Solution Name: $(varSolutionName)"
        Write-Host "Solution Type: $(varSolutionType)"
        Write-Host "Target Environment: $(varTargetEnvironmentURL)"
        Write-Host "Service Connection: $(varTargetServiceConnection)"
        Write-Host "============================================"
        Write-Host ""
        Write-Host "NEXT STEPS:"
        Write-Host "1. Configure Connection References manually in the target environment"
        Write-Host "2. Set Environment Variables values as needed"
        Write-Host "3. Validate solution functionality"
        Write-Host "============================================"
      displayName: 'Deployment Summary'
