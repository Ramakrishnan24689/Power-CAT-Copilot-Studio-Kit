# ============================================================================
# Template: Deployment Job Template
# Description: Reusable job template for deploying Power Platform solutions
# ============================================================================

parameters:
  - name: jobName
    type: string
    displayName: 'Job Name'
  
  - name: jobDisplayName
    type: string
    displayName: 'Job Display Name'
  
  - name: environmentURL
    type: string
    displayName: 'Target Environment URL'
  
  - name: serviceConnection
    type: string
    displayName: 'Service Connection Name'
  
  - name: solutionType
    type: string
    displayName: 'Solution Type (managed or unmanaged)'
    values:
      - managed
      - unmanaged
  
jobs:
- job: ${{ parameters.jobName }}
  displayName: ${{ parameters.jobDisplayName }}
  steps:
  
  # ========================================================================
  # Download artifacts from Export stage
  # ========================================================================
  - download: current
    artifact: drop
    displayName: 'Download Main Solution Artifacts'
  
  - task: DownloadPipelineArtifact@2
    displayName: 'Download Component Collections Artifacts'
    condition: eq(variables['varRunComponentsSolutions'], 'true')
    inputs:
      buildType: 'current'
      artifactName: 'component-collections'
      targetPath: '$(Pipeline.Workspace)/component-collections'
  
  # ========================================================================
  # Install Power Platform Build Tools
  # ========================================================================
  - task: PowerPlatformToolInstaller@2
    displayName: 'Install Power Platform Build Tools'
  
  # ========================================================================
  # MAIN SOLUTION DEPLOYMENT
  # ========================================================================
  
  # ========================================================================
  # Determine Solution File Path - Main Solution
  # ========================================================================
  - powershell: |
      $solutionType = "${{ parameters.solutionType }}".ToLower()
      $outputSolutionName = "$(varOutputSolutionName)"
      $downloadPath = "$(Pipeline.Workspace)/drop"
      
      if ($solutionType -eq "managed") {
          # Find managed file with date stamp pattern
          $pattern = "${outputSolutionName}_*_managed.zip"
          $managedFiles = Get-ChildItem -Path $downloadPath -Filter $pattern
          
          if ($managedFiles.Count -eq 0) {
              Write-Host "##vso[task.logissue type=error]Managed solution not found with pattern: $pattern"
              Write-Host "Available files in download path:"
              Get-ChildItem -Path $downloadPath | ForEach-Object { Write-Host "  $_" }
              exit 1
          }
          
          $solutionFile = $managedFiles[0].FullName
          Write-Host "##[section]Deploying MANAGED solution: $($managedFiles[0].Name)"
      }
      elseif ($solutionType -eq "unmanaged") {
          $solutionFile = "${downloadPath}/${outputSolutionName}.zip"
          Write-Host "##[section]Deploying UNMANAGED solution: ${outputSolutionName}.zip"
      }
      else {
          Write-Host "##vso[task.logissue type=error]Invalid solutionType. Must be 'managed' or 'unmanaged'"
          exit 1
      }
      
      if (-not (Test-Path $solutionFile)) {
          Write-Host "##vso[task.logissue type=error]Solution file not found: $solutionFile"
          Write-Host "Available files in download path:"
          Get-ChildItem -Path $downloadPath | ForEach-Object { Write-Host "  $_" }
          exit 1
      }
      
      Write-Host "##vso[task.setvariable variable=SolutionFilePath]$solutionFile"
      Write-Host "Solution file validated: $solutionFile"
    displayName: 'Determine Solution File Path ($(varOutputSolutionName))'
  
  # ========================================================================
  # Import Solution - Main Solution
  # ========================================================================
  - task: PowerPlatformImportSolution@2
    displayName: 'Import Solution ($(varOutputSolutionName)) - ${{ parameters.solutionType }}'
    inputs:
      authenticationType: 'PowerPlatformSPN'
      PowerPlatformSPN: '${{ parameters.serviceConnection }}'
      Environment: '${{ parameters.environmentURL }}'
      SolutionInputFile: '$(SolutionFilePath)'
      AsyncOperation: true
      MaxAsyncWaitTime: 60
      UseDeploymentSettingsFile: false
      OverwriteUnmanagedCustomizations: false
      SkipProductUpdateDependencies: false
      ConvertToManaged: false
      HoldingSolution: false
  
  # ========================================================================
  # Publish Customizations (Unmanaged Only) - Main Solution
  # ========================================================================
  - task: PowerPlatformPublishCustomizations@2
    displayName: 'Publish Customizations ($(varOutputSolutionName))'
    condition: eq('${{ parameters.solutionType }}', 'unmanaged')
    inputs:
      authenticationType: 'PowerPlatformSPN'
      PowerPlatformSPN: '${{ parameters.serviceConnection }}'
      Environment: '${{ parameters.environmentURL }}'
  
  # ========================================================================
  # COMPONENT COLLECTIONS DEPLOYMENT
  # ========================================================================
  
  # ========================================================================
  # Determine Solution File Path - CopilotStudioKit_ContentSynth_Component
  # ========================================================================
  - powershell: |
      $solutionType = "${{ parameters.solutionType }}".ToLower()
      $outputSolutionName = "CopilotStudioKit_ContentSynth_Component"
      $downloadPath = "$(Pipeline.Workspace)/component-collections"
      
      if ($solutionType -eq "managed") {
          # Find managed file with date stamp pattern
