      Write-Host "##vso[task.setvariable variable=SolutionFilePath_ContentSynthesizer]$solutionFile"
      Write-Host "Solution file validated: $solutionFile"
    displayName: 'Determine Solution File Path - CopilotStudioKit_ContentSynth_Component'
    condition: eq(variables['varRunComponentsSolutions'], 'true')
  
  # ========================================================================
  # Import Solution - CopilotStudioKit_ContentSynth_Component
  # ========================================================================
  - task: PowerPlatformImportSolution@2
    displayName: 'Import CopilotStudioKit_ContentSynth_Component (${{ parameters.solutionType }})'
    condition: eq(variables['varRunComponentsSolutions'], 'true')
    inputs:
      authenticationType: 'PowerPlatformSPN'
      PowerPlatformSPN: '${{ parameters.serviceConnection }}'
      Environment: '${{ parameters.environmentURL }}'
      SolutionInputFile: '$(SolutionFilePath_ContentSynthesizer)'
