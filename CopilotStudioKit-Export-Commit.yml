# ============================================================================
# Pipeline: CopilotStudioKit-Export-Commit
# Description: Export Power Platform solution, unpack to repo, and publish artifacts
# ============================================================================

trigger: none  # Manual trigger only

pool:
  vmImage: windows-latest

variables:
  # Pipeline variables (set in Azure DevOps pipeline UI):
  # - varSourceEnvironmentURL: The source environment URL (e.g., https://org.crm.dynamics.com/)
  # - varSolutionName: The unique name of the solution to export
  
  # Internal variables
  SolutionOutputFolder: $(Build.ArtifactStagingDirectory)/solutions
  UnpackedSolutionFolder: $(Build.SourcesDirectory)/src/$(varSolutionName)

steps:
# ============================================================================
# Step 1: Checkout repository with credentials for commit
# ============================================================================
- checkout: self
  persistCredentials: true
  clean: true
  displayName: 'Checkout Repository'

# ============================================================================
# Step 2: Install Power Platform Build Tools
# ============================================================================
- task: PowerPlatformToolInstaller@2
  displayName: 'Install Power Platform Build Tools'

# ============================================================================
# Step 3: Export Unmanaged Solution
# ============================================================================
- task: PowerPlatformExportSolution@2
  displayName: 'Export Unmanaged Solution'
  inputs:
    authenticationType: 'PowerPlatformSPN'
    PowerPlatformSPN: '$(varSourceEnvironmentURL)'
    Environment: '$(varSourceEnvironmentURL)'
    SolutionName: '$(varSolutionName)'
    SolutionOutputFile: '$(SolutionOutputFolder)/$(varSolutionName).zip'
    Managed: false

# ============================================================================
# Step 4: Export Managed Solution
# ============================================================================
- task: PowerPlatformExportSolution@2
  displayName: 'Export Managed Solution'
  inputs:
    authenticationType: 'PowerPlatformSPN'
    PowerPlatformSPN: '$(varSourceEnvironmentURL)'
    Environment: '$(varSourceEnvironmentURL)'
    SolutionName: '$(varSolutionName)'
    SolutionOutputFile: '$(SolutionOutputFolder)/$(varSolutionName)_managed.zip'
    Managed: true

# ============================================================================
# Step 5: Unpack Unmanaged Solution to Source Control
# ============================================================================
- task: PowerPlatformUnpackSolution@2
  displayName: 'Unpack Unmanaged Solution'
  inputs:
    SolutionInputFile: '$(SolutionOutputFolder)/$(varSolutionName).zip'
    SolutionTargetFolder: '$(UnpackedSolutionFolder)/SolutionPackage'
    SolutionType: 'Both'
    ProcessCanvasApps: false

# ============================================================================
# Step 6: Extract Solution Version and Rename Managed Solution
# ============================================================================
- powershell: |
    $solutionXmlPath = "$(UnpackedSolutionFolder)/SolutionPackage/Other/Solution.xml"
    
    Write-Host "Reading solution version from: $solutionXmlPath"
    
    if (-not (Test-Path $solutionXmlPath)) {
        Write-Host "##vso[task.logissue type=error]Solution.xml not found at: $solutionXmlPath"
        exit 1
    }
    
    # Read and parse Solution.xml
    [xml]$solutionXml = Get-Content $solutionXmlPath
    $fullVersion = $solutionXml.ImportExportXml.SolutionManifest.Version
    
    if ([string]::IsNullOrWhiteSpace($fullVersion)) {
        Write-Host "##vso[task.logissue type=error]Unable to extract version from Solution.xml"
        exit 1
    }
    
    Write-Host "Full solution version: $fullVersion"
    
    # Extract major version (first part before first dot) - e.g., "20260202.2" -> "20260202"
    $majorVersion = $fullVersion.Split('.')[0]
    Write-Host "Major version (for filename): $majorVersion"
    
    # Rename managed solution file
    $originalManagedFile = "$(SolutionOutputFolder)/$(varSolutionName)_managed.zip"
    $newManagedFile = "$(SolutionOutputFolder)/$(varSolutionName)_${majorVersion}_managed.zip"
    
    if (Test-Path $originalManagedFile) {
        Rename-Item -Path $originalManagedFile -NewName (Split-Path $newManagedFile -Leaf)
        Write-Host "##[section]Renamed managed solution:"
        Write-Host "  From: $(varSolutionName)_managed.zip"
        Write-Host "  To:   $(varSolutionName)_${majorVersion}_managed.zip"
    } else {
        Write-Host "##vso[task.logissue type=error]Managed solution file not found: $originalManagedFile"
        exit 1
    }
    
    # Set variable for later use
    Write-Host "##vso[task.setvariable variable=SolutionVersion]$majorVersion"
    Write-Host ""
    Write-Host "Solution version: $majorVersion"
  displayName: 'Extract Version and Rename Managed Solution'

# ============================================================================
# Step 7: Publish Pipeline Artifacts
# ============================================================================
- task: PublishPipelineArtifact@1
  displayName: 'Publish Solution Artifacts'
  inputs:
    targetPath: '$(SolutionOutputFolder)'
    artifact: 'drop'
    publishLocation: 'pipeline'

# ============================================================================
# Step 8: Configure Git for Commit
# ============================================================================
- script: |
    git config --global user.email "$(Build.RequestedForEmail)"
    git config --global user.name "$(Build.RequestedFor)"
  displayName: 'Configure Git Credentials'

# ============================================================================
# Step 9: Commit and Push Changes to Repository
# ============================================================================
- script: |
    git add --all
    git diff --cached --quiet || git commit -m "Exported $(varSolutionName) from $(varSourceEnvironmentURL) [skip ci]"
    git push origin HEAD:main
  displayName: 'Commit and Push Solution to Main'
  workingDirectory: $(Build.SourcesDirectory)