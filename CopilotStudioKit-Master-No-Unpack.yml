        if ($runComponents -eq "true") {
            Write-Host "  2. Component Collection: CopilotStudioKit_ContentSynth_Component"
            Write-Host "  3. Component Collection: CopilotStudioKit_Research_Component"
            Write-Host "  4. Component Collection: CopilotStudioKit_ExecBrief_Component"
            Write-Host "  5. Component Collection: CopilotStudioKit_DocumentExtraction_Component"
            Write-Host "  6. Component Collection: CopilotStudioKit_ServiceNow_Components"
        } else {
