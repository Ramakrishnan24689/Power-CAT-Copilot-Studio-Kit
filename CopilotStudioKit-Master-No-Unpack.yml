        Write-Host "NEXT STEPS:"
        Write-Host "1. Configure Connection References manually in the target environment"
        Write-Host "2. Set Environment Variables values as needed"
        Write-Host "3. Validate solution functionality"
        Write-Host "============================================"
      displayName: 'Deployment Summary'

# ============================================================================
# STAGE 3: RELEASE
# ============================================================================
- stage: Release
  displayName: 'GitHub Release'
  dependsOn: Deploy
  condition: and(succeeded(), eq(variables['varReleaseBuild'], 'true'))
  jobs:
  - job: ReleaseJob
    displayName: 'Create Release'
    steps:
    
    # ========================================================================
    # Checkout Azure DevOps Repository
    # ========================================================================
    - checkout: self
      displayName: 'Checkout Azure DevOps Repository'
    
    # ========================================================================
    # Checkout GitHub Repository (for artifacts)
    # ========================================================================
    - checkout: GitHubRepo
      displayName: 'Checkout GitHub Repository for Assets'
    
    # ========================================================================
    # Validate Required Variables
    # ========================================================================
    - powershell: |
        Write-Host "============================================"
        Write-Host "VALIDATING PIPELINE VARIABLES"
        Write-Host "============================================"
        
        $errors = @()
        
        $requiredVars = @{
            'varGitHubConnection' = '$(varGitHubConnection)'
            'varGitHubRepo' = '$(varGitHubRepo)'
            'varOutputSolutionName' = '$(varOutputSolutionName)'
            'varReleaseName' = '$(varReleaseName)'
            'varReleaseMonth' = '$(varReleaseMonth)'
            'varReleaseYear' = '$(varReleaseYear)'
        }
        
        foreach ($var in $requiredVars.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($var.Value) -or $var.Value -eq "`$($($var.Key))") {
                $errors += "Missing or empty variable: $($var.Key)"
                Write-Host "##vso[task.logissue type=error]Missing variable: $($var.Key)"
            } else {
                Write-Host "✓ $($var.Key): $($var.Value)"
            }
        }
        
        $repoFormat = '$(varGitHubRepo)'
        if ($repoFormat -notmatch '^[\w-]+/[\w-]+$') {
            $errors += "varGitHubRepo must be in format 'owner/repo'"
            Write-Host "##vso[task.logissue type=error]Invalid GitHub repo format: $repoFormat"
        }
        
        # Validate component catalog variable if components are enabled
        $runComponents = "$(varRunComponentsSolutions)".ToLower()
        if ($runComponents -eq "true") {
            $catalogFolderName = "$(varComponentCatalogFolderName)"
            if ([string]::IsNullOrWhiteSpace($catalogFolderName)) {
                $errors += "varComponentCatalogFolderName is required when varRunComponentsSolutions is 'true'"
                Write-Host "##vso[task.logissue type=error]Missing variable: varComponentCatalogFolderName"
            } else {
                Write-Host "✓ varComponentCatalogFolderName: $catalogFolderName"
            }
        }
        
        Write-Host "============================================"
        
        if ($errors.Count -gt 0) {
            Write-Host "##vso[task.logissue type=error]Validation failed with $($errors.Count) error(s)"
            exit 1
        }
        
        Write-Host "✓ All required variables validated successfully"
        Write-Host "============================================"
      displayName: 'Validate Required Variables'
    
    # ========================================================================
    # Download artifacts from Export stage
    # ========================================================================
    - download: current
      artifact: drop
      displayName: 'Download Main Solution Artifacts'
    
    - download: current
      artifact: component-collections
      displayName: 'Download Component Collections Artifacts'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
    
    # ========================================================================
    # Generate Release Tag and Collect All Assets
    # ========================================================================
    - powershell: |
        $releaseName = "$(varReleaseName)"
        $releaseMonth = "$(varReleaseMonth)"
        $releaseYear = "$(varReleaseYear)"
        $outputSolutionName = "$(varOutputSolutionName)"
        $downloadPath = "$(Pipeline.Workspace)/drop"
        $componentDownloadPath = "$(Pipeline.Workspace)/component-collections"
        $repoPath = "$(Build.SourcesDirectory)/Power-CAT-Copilot-Studio-Kit"
        $artefactsFolder = "${repoPath}/CopilotstudioAcceleratorResources/Release/Artefacts"
        
        $releaseTag = "${releaseName}-${releaseMonth}${releaseYear}"
        
        # Generate release title with spaces: e.g., "Copilot Studio Kit February 2026"
        # Convert CopilotStudioKit to "Copilot Studio Kit" by adding spaces before capitals
        $titleName = $outputSolutionName -creplace '([A-Z])', ' $1'
        $titleName = $titleName.Trim()
        $releaseTitle = "${titleName} ${releaseMonth} ${releaseYear}"
        
        Write-Host "##[section]Generated Release Tag: $releaseTag"
        Write-Host "##[section]Generated Release Title: $releaseTitle"
        Write-Host "##vso[task.setvariable variable=ReleaseTag]$releaseTag"
        Write-Host "##vso[task.setvariable variable=ReleaseTitle]$releaseTitle"
        
        Write-Host ""
        Write-Host "============================================"
        Write-Host "COLLECTING MAIN SOLUTION ARTIFACTS"
        Write-Host "============================================"
        
        # Find main solution unmanaged
        $unmanagedFile = "${downloadPath}/${outputSolutionName}.zip"
        
        # Find main solution managed with date stamp
        $managedPattern = "${outputSolutionName}_*_managed.zip"
        $managedFiles = Get-ChildItem -Path $downloadPath -Filter $managedPattern
        
        if (-not (Test-Path $unmanagedFile)) {
            Write-Host "##vso[task.logissue type=error]Unmanaged solution not found: $unmanagedFile"
            exit 1
        }
        Write-Host "✓ Main solution (unmanaged): $(Split-Path $unmanagedFile -Leaf)"
        
        if ($managedFiles.Count -eq 0) {
            Write-Host "##vso[task.logissue type=error]Managed solution not found with pattern: $managedPattern"
            exit 1
        }
        $managedFile = $managedFiles[0].FullName
        Write-Host "✓ Main solution (managed): $($managedFiles[0].Name)"
        
        # Collect all assets
        $allAssets = @()
        $allAssets += $unmanagedFile
        $allAssets += $managedFile
        
        # Check if component collections should be included
        $runComponents = "$(varRunComponentsSolutions)".ToLower()
        
        if ($runComponents -eq "true") {
            Write-Host ""
            Write-Host "============================================"
            Write-Host "CREATING COMPONENT COLLECTIONS CATALOG"
            Write-Host "============================================"
            
            $catalogFolderName = "$(varComponentCatalogFolderName)"
            if ([string]::IsNullOrWhiteSpace($catalogFolderName)) {
                Write-Host "##vso[task.logissue type=error]varComponentCatalogFolderName is not set or empty"
                exit 1
            }
            
            Write-Host "Catalog Folder Name: $catalogFolderName"
            
            # Create catalog folder in download path
            $catalogFolder = "${downloadPath}/${catalogFolderName}"
            if (Test-Path $catalogFolder) {
                Remove-Item -Path $catalogFolder -Recurse -Force
            }
            New-Item -Path $catalogFolder -ItemType Directory | Out-Null
            Write-Host "✓ Created catalog folder: $catalogFolderName"
            
            # Collect all component files into the catalog folder
            $componentFiles = @()
            
            # Component 1: CopilotStudioKit_ContentSynth_Component
            $component1Unmanaged = "${componentDownloadPath}/CopilotStudioKit_ContentSynth_Component.zip"
            $component1ManagedPattern = "CopilotStudioKit_ContentSynth_Component_*_managed.zip"
            $component1ManagedFiles = Get-ChildItem -Path $componentDownloadPath -Filter $component1ManagedPattern -ErrorAction SilentlyContinue
            
            if (Test-Path $component1Unmanaged) {
                $componentFiles += $component1Unmanaged
                Write-Host "  ✓ Found CopilotStudioKit_ContentSynth_Component (unmanaged)"
            } else {
                Write-Host "##vso[task.logissue type=warning]CopilotStudioKit_ContentSynth_Component unmanaged not found"
            }
            
            if ($component1ManagedFiles.Count -gt 0) {
                $componentFiles += $component1ManagedFiles[0].FullName
                Write-Host "  ✓ Found CopilotStudioKit_ContentSynth_Component (managed)"
            } else {
                Write-Host "##vso[task.logissue type=warning]CopilotStudioKit_ContentSynth_Component managed not found"
            }
            
            # Component 2: CopilotStudioKit_Research_Component
            $component2Unmanaged = "${componentDownloadPath}/CopilotStudioKit_Research_Component.zip"
            $component2ManagedPattern = "CopilotStudioKit_Research_Component_*_managed.zip"
            $component2ManagedFiles = Get-ChildItem -Path $componentDownloadPath -Filter $component2ManagedPattern -ErrorAction SilentlyContinue
            
            if (Test-Path $component2Unmanaged) {
                $componentFiles += $component2Unmanaged
                Write-Host "  ✓ Found CopilotStudioKit_Research_Component (unmanaged)"
            } else {
                Write-Host "##vso[task.logissue type=warning]CopilotStudioKit_Research_Component unmanaged not found"
            }
            
            if ($component2ManagedFiles.Count -gt 0) {
                $componentFiles += $component2ManagedFiles[0].FullName
                Write-Host "  ✓ Found CopilotStudioKit_Research_Component (managed)"
            } else {
                Write-Host "##vso[task.logissue type=warning]CopilotStudioKit_Research_Component managed not found"
            }
            
            # Component 3: CopilotStudioKit_ExecBrief_Component
            $component3Unmanaged = "${componentDownloadPath}/CopilotStudioKit_ExecBrief_Component.zip"
            $component3ManagedPattern = "CopilotStudioKit_ExecBrief_Component_*_managed.zip"
            $component3ManagedFiles = Get-ChildItem -Path $componentDownloadPath -Filter $component3ManagedPattern -ErrorAction SilentlyContinue
            
            if (Test-Path $component3Unmanaged) {
                $componentFiles += $component3Unmanaged
                Write-Host "  ✓ Found CopilotStudioKit_ExecBrief_Component (unmanaged)"
            } else {
                Write-Host "##vso[task.logissue type=warning]CopilotStudioKit_ExecBrief_Component unmanaged not found"
            }
            
            if ($component3ManagedFiles.Count -gt 0) {
                $componentFiles += $component3ManagedFiles[0].FullName
                Write-Host "  ✓ Found CopilotStudioKit_ExecBrief_Component (managed)"
            } else {
                Write-Host "##vso[task.logissue type=warning]CopilotStudioKit_ExecBrief_Component managed not found"
            }
            
            # Component 4: CopilotStudioKit_DocumentExtraction_Component
            $component4Unmanaged = "${componentDownloadPath}/CopilotStudioKit_DocumentExtraction_Component.zip"
            $component4ManagedPattern = "CopilotStudioKit_DocumentExtraction_Component_*_managed.zip"
            $component4ManagedFiles = Get-ChildItem -Path $componentDownloadPath -Filter $component4ManagedPattern -ErrorAction SilentlyContinue
            
            if (Test-Path $component4Unmanaged) {
                $componentFiles += $component4Unmanaged
                Write-Host "  ✓ Found CopilotStudioKit_DocumentExtraction_Component (unmanaged)"
            } else {
                Write-Host "##vso[task.logissue type=warning]CopilotStudioKit_DocumentExtraction_Component unmanaged not found"
            }
            
            if ($component4ManagedFiles.Count -gt 0) {
                $componentFiles += $component4ManagedFiles[0].FullName
                Write-Host "  ✓ Found CopilotStudioKit_DocumentExtraction_Component (managed)"
            } else {
                Write-Host "##vso[task.logissue type=warning]CopilotStudioKit_DocumentExtraction_Component managed not found"
            }
            
            # Component 5: CopilotStudioKit_ServiceNow_Components
            $component5Unmanaged = "${componentDownloadPath}/CopilotStudioKit_ServiceNow_Components.zip"
            $component5ManagedPattern = "CopilotStudioKit_ServiceNow_Components_*_managed.zip"
            $component5ManagedFiles = Get-ChildItem -Path $componentDownloadPath -Filter $component5ManagedPattern -ErrorAction SilentlyContinue
            
            if (Test-Path $component5Unmanaged) {
                $componentFiles += $component5Unmanaged
                Write-Host "  ✓ Found CopilotStudioKit_ServiceNow_Components (unmanaged)"
            } else {
                Write-Host "##vso[task.logissue type=warning]CopilotStudioKit_ServiceNow_Components unmanaged not found"
            }
            
            if ($component5ManagedFiles.Count -gt 0) {
                $componentFiles += $component5ManagedFiles[0].FullName
                Write-Host "  ✓ Found CopilotStudioKit_ServiceNow_Components (managed)"
            } else {
                Write-Host "##vso[task.logissue type=warning]CopilotStudioKit_ServiceNow_Components managed not found"
            }
            
            Write-Host ""
            Write-Host "Total component files found: $($componentFiles.Count)"
            
            # Copy all component files to catalog folder
            Write-Host "Copying component files to catalog folder..."
            foreach ($file in $componentFiles) {
                $fileName = Split-Path $file -Leaf
                $destination = Join-Path $catalogFolder $fileName
                Copy-Item -Path $file -Destination $destination -Force
                Write-Host "  ✓ Copied: $fileName"
            }
            
            # Zip the catalog folder
            Write-Host ""
            Write-Host "Creating catalog zip file..."
            $catalogZipPath = "${downloadPath}/${catalogFolderName}.zip"
            if (Test-Path $catalogZipPath) {
                Remove-Item -Path $catalogZipPath -Force
            }
            
            Compress-Archive -Path "${catalogFolder}/*" -DestinationPath $catalogZipPath -CompressionLevel Optimal
            Write-Host "✓ Created: ${catalogFolderName}.zip"
            Write-Host "  Path: $catalogZipPath"
            
            # Add only the catalog zip to assets (not individual files)
            $allAssets += $catalogZipPath
            
            Write-Host ""
            Write-Host "============================================"
            Write-Host "COMPONENT CATALOG CREATED SUCCESSFULLY"
            Write-Host "============================================"
            Write-Host "Catalog: ${catalogFolderName}.zip"
            Write-Host "Contains: $($componentFiles.Count) component solution files"
        } else {
            Write-Host ""
            Write-Host "============================================"
            Write-Host "COMPONENT COLLECTIONS: SKIPPED"
            Write-Host "============================================"
            Write-Host "ℹ varRunComponentsSolutions is not set to 'true'"
            Write-Host "ℹ Component collections will not be included in this release"
        }
        
        # Add files from GitHub repository folder
        Write-Host ""
        Write-Host "============================================"
        Write-Host "COLLECTING ADDITIONAL ASSETS FROM GITHUB"
        Write-Host "============================================"
        
        if (Test-Path $artefactsFolder) {
            $repoFiles = Get-ChildItem -Path $artefactsFolder -File
            if ($repoFiles.Count -gt 0) {
                Write-Host "✓ Found $($repoFiles.Count) additional file(s) in CopilotstudioAcceleratorResources/Release/Artefacts:"
                foreach ($file in $repoFiles) {
                    Write-Host "  - $($file.Name)"
                    $allAssets += $file.FullName
                }
            } else {
                Write-Host "⚠ No files found in CopilotstudioAcceleratorResources/Release/Artefacts folder"
            }
        } else {
            Write-Host "##vso[task.logissue type=warning]Folder not found: $artefactsFolder"
        }
        
        # Copy all files to a single staging directory for GitHub Release
        $stagingFolder = "${downloadPath}/ReleaseAssets"
        if (Test-Path $stagingFolder) {
            Remove-Item -Path $stagingFolder -Recurse -Force
        }
        New-Item -Path $stagingFolder -ItemType Directory | Out-Null
        
        Write-Host ""
        Write-Host "Copying all assets to staging folder..."
        foreach ($asset in $allAssets) {
            $fileName = Split-Path $asset -Leaf
            $destination = Join-Path $stagingFolder $fileName
            Copy-Item -Path $asset -Destination $destination -Force
            Write-Host "  ✓ Copied: $fileName"
        }
        
        # Set staging folder path for GitHub Release task
        Write-Host "##vso[task.setvariable variable=StagingFolder]$stagingFolder"
        
        Write-Host ""
        Write-Host "============================================"
        Write-Host "RELEASE SUMMARY"
        Write-Host "============================================"
        Write-Host "Release Tag: $releaseTag"
        Write-Host "Release Title: $releaseTitle"
        Write-Host "GitHub Repo: $(varGitHubRepo)"
        Write-Host ""
        Write-Host "Solutions included:"
        Write-Host "  • Main solution: $outputSolutionName (2 files)"
        
        if ($runComponents -eq "true") {
            $catalogFolderName = "$(varComponentCatalogFolderName)"
            Write-Host "  • Component Collections Catalog: ${catalogFolderName}.zip (contains 5 solutions, 10 files)"
            Write-Host "    - CopilotStudioKit_ContentSynth_Component"
            Write-Host "    - CopilotStudioKit_Research_Component"
            Write-Host "    - CopilotStudioKit_ExecBrief_Component"
            Write-Host "    - CopilotStudioKit_DocumentExtraction_Component"
            Write-Host "    - CopilotStudioKit_ServiceNow_Components"
        } else {
            Write-Host "  (Component Collections: Skipped)"
        }
        
        Write-Host ""
        Write-Host "Total Assets: $($allAssets.Count)"
        Write-Host "============================================"
      displayName: 'Generate Release Tag and Collect All Assets'
    
    # ========================================================================
    # Fetch GitHub Milestone Issues (Optional)
    # ========================================================================
    - powershell: |
        $milestoneName = "$(varMileStone)".Trim()
        $githubRepo = "$(varGitHubRepo)"
        
        # Initialize empty release notes
        $issuesMarkdown = ""
        $releaseNotesFile = "$(Pipeline.Workspace)/milestone-issues.md"
        
        if ([string]::IsNullOrWhiteSpace($milestoneName)) {
            Write-Host "ℹ varMileStone is not set. Skipping milestone issues fetch."
            Set-Content -Path $releaseNotesFile -Value "" -NoNewline
            Write-Host "##vso[task.setvariable variable=MilestoneIssuesFile]$releaseNotesFile"
            exit 0
        }
        
        Write-Host "##[section]Fetching issues from milestone: $milestoneName"
        
        try {
            # Get GitHub PAT from environment variable
            $token = $env:GITHUB_PAT
            
            if ([string]::IsNullOrWhiteSpace($token)) {
                Write-Host "##[warning]GitHubPAT not found in variable group 'alm-accelerator-variable-group'."
                Write-Host "##[warning]Cannot fetch milestone issues without GitHub PAT."
                Set-Content -Path $releaseNotesFile -Value "" -NoNewline
                Write-Host "##vso[task.setvariable variable=MilestoneIssuesFile]$releaseNotesFile"
                exit 0
            }
            
            $headers = @{
                "Accept" = "application/vnd.github.v3+json"
                "Authorization" = "Bearer $token"
                "User-Agent" = "AzureDevOps-Pipeline"
            }
            
            # Get milestone by name
            $milestonesUrl = "https://api.github.com/repos/$githubRepo/milestones?state=all"
            Write-Host "Fetching milestones from: $milestonesUrl"
            
            $milestones = Invoke-RestMethod -Uri $milestonesUrl -Headers $headers -Method Get
            $milestone = $milestones | Where-Object { $_.title -eq $milestoneName } | Select-Object -First 1
            
            if (-not $milestone) {
                Write-Host "##[warning]Milestone '$milestoneName' not found. Continuing without milestone issues."
                Set-Content -Path $releaseNotesFile -Value "" -NoNewline
                Write-Host "##vso[task.setvariable variable=MilestoneIssuesFile]$releaseNotesFile"
                exit 0
            }
            
            Write-Host "✓ Found milestone: $($milestone.title) (Number: $($milestone.number))"
            
            # Get issues for this milestone
            $issuesUrl = "https://api.github.com/repos/$githubRepo/issues?milestone=$($milestone.number)&state=all&per_page=100"
            Write-Host "Fetching issues from: $issuesUrl"
            
            $issues = Invoke-RestMethod -Uri $issuesUrl -Headers $headers -Method Get
            
            if ($issues.Count -eq 0) {
                Write-Host "##[warning]No issues found in milestone '$milestoneName'. Continuing without milestone issues."
                Set-Content -Path $releaseNotesFile -Value "" -NoNewline
                Write-Host "##vso[task.setvariable variable=MilestoneIssuesFile]$releaseNotesFile"
                exit 0
            }
            
            Write-Host "✓ Found $($issues.Count) issue(s) in milestone"
            
            # Build markdown for issues
            $issuesMarkdown = "`n`n## GitHub issues fixed (improvements and issues):`n`n"
            
            foreach ($issue in $issues) {
                # Skip pull requests (they appear in issues API)
                if ($issue.pull_request) { continue }
                
                $issueTitle = $issue.title
                $issueNumber = $issue.number
                $issueUrl = $issue.html_url
                
                # Add issue as markdown link
                $issuesMarkdown += "* [$issueTitle #$issueNumber]($issueUrl)`n"
            }
            
            Write-Host ""
            Write-Host "Milestone issues markdown generated:"
            Write-Host $issuesMarkdown
            
            # Write to file for release notes
            Set-Content -Path $releaseNotesFile -Value $issuesMarkdown -NoNewline
            Write-Host "Written to file: $releaseNotesFile"
            Write-Host "##vso[task.setvariable variable=MilestoneIssuesFile]$releaseNotesFile"
            
        } catch {
            Write-Host "##[warning]Failed to fetch milestone issues: $($_.Exception.Message)"
            Write-Host "##[warning]Continuing without milestone issues."
            # Create empty file on error
            Set-Content -Path $releaseNotesFile -Value "" -NoNewline
            Write-Host "##vso[task.setvariable variable=MilestoneIssuesFile]$releaseNotesFile"
        }
      displayName: 'Fetch GitHub Milestone Issues (Optional)'
      env:
        GITHUB_PAT: $(GitHubPAT)
    
    # ========================================================================
    # Generate Combined Release Notes
    # ========================================================================
    - powershell: |
        Write-Host "============================================"
        Write-Host "GENERATING COMBINED RELEASE NOTES"
        Write-Host "============================================"
        
        $milestoneFile = "$(MilestoneIssuesFile)"
        $releaseNotesPath = "$(Pipeline.Workspace)/release-notes.md"
        
        # Initialize release notes (empty by default)
        $releaseNotes = ""
        
        # Append milestone issues if file exists and has content
        if (Test-Path $milestoneFile) {
            $milestoneContent = Get-Content -Path $milestoneFile -Raw
            if (-not [string]::IsNullOrWhiteSpace($milestoneContent)) {
                Write-Host "✓ Adding milestone issues to release notes"
                $releaseNotes = $milestoneContent
            } else {
                Write-Host "ℹ Milestone file is empty, no content to add"
            }
        } else {
            Write-Host "ℹ No milestone file found, no content to add"
        }
        
        # Write release notes to file (will be empty if no milestone)
        Set-Content -Path $releaseNotesPath -Value $releaseNotes -NoNewline
        Write-Host "##vso[task.setvariable variable=ReleaseNotesFile]$releaseNotesPath"
        
        Write-Host ""
        Write-Host "Release notes preview:"
        Write-Host "============================================"
        if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            Write-Host "(Empty - no milestone issues found)"
        } else {
            Write-Host $releaseNotes
        }
        Write-Host "============================================"
      displayName: 'Generate Combined Release Notes'
      condition: succeeded()
    
    # ========================================================================
    # Create GitHub Draft Release
    # ========================================================================
    - task: GitHubRelease@1
      displayName: 'Create GitHub Draft Release'
      inputs:
        gitHubConnection: '$(varGitHubConnection)'
        repositoryName: '$(varGitHubRepo)'
        action: 'create'
        target: 'main'
        tagSource: 'userSpecifiedTag'
        tag: '$(ReleaseTag)'
        title: '$(ReleaseTitle)'
        releaseNotesSource: 'filePath'
        releaseNotesFilePath: '$(ReleaseNotesFile)'
        assets: '$(StagingFolder)/*'
        isDraft: true
        isPreRelease: false
        addChangeLog: false
    
    # ========================================================================
    # Release Summary
    # ========================================================================
    - powershell: |
        Write-Host "============================================"
        Write-Host "GITHUB RELEASE CREATED SUCCESSFULLY"
        Write-Host "============================================"
        Write-Host "Release Tag: $(ReleaseTag)"
        Write-Host "Repository: https://github.com/$(varGitHubRepo)"
        Write-Host "Release URL: https://github.com/$(varGitHubRepo)/releases/tag/$(ReleaseTag)"
        Write-Host "Status: DRAFT"
        Write-Host "============================================"
        Write-Host ""
        Write-Host "NEXT STEPS:"
        Write-Host "1. Visit the GitHub release page"
        Write-Host "2. Update release notes manually"
        Write-Host "3. Publish the release when ready"
        Write-Host "============================================"
      displayName: 'Release Summary'

# ============================================================================
# STAGE 4: DEPLOY TO INTERNAL TEST ENVIRONMENTS
# ============================================================================
- stage: DeployToInternalTestEnvironments
  displayName: 'Deploy to Internal Test Environments'
  dependsOn: Deploy
  condition: and(succeeded(), eq(variables['varRunInternalTestDeployment'], 'true'))
  jobs:
  
  # ========================================================================
  # Deploy Managed Solution to Internal Test Environment
  # ========================================================================
  - template: deployment-job-template.yml
    parameters:
      jobName: 'DeployManagedToInternalTest'
      jobDisplayName: 'Deploy Managed Solutions to Internal Test'
      environmentURL: '$(varInternalTestManagedEnvironmentURL)'
      serviceConnection: '$(varInternalTestManagedServiceConnection)'
      solutionType: 'managed'

  # ========================================================================
  # Deploy Unmanaged Solution to Internal Test Environment
  # ========================================================================
  - template: deployment-job-template.yml
    parameters:
      jobName: 'DeployUnmanagedToInternalTest'
      jobDisplayName: 'Deploy Unmanaged Solutions to Internal Test'
      environmentURL: '$(varInternalTestUnmanagedEnvironmentURL)'
      serviceConnection: '$(varInternalTestUnmanagedServiceConnection)'
      solutionType: 'unmanaged'
