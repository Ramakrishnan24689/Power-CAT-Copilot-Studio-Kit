# ============================================================================
# Pipeline: CopilotStudioKit-Master
# Description: Orchestrates Export, Deploy, and Release workflows
# ============================================================================

trigger: none  # Manual trigger only

pool:
  vmImage: windows-latest

resources:
  repositories:
    - repository: GitHubRepo
      type: github
      endpoint: powercat-alm
      name: microsoft/Power-CAT-Copilot-Studio-Kit

variables:
  # Variable group with GitHubPAT (Required if using varMileStone)
  - group: alm-accelerator-variable-group
  
  # Internal variables
  - name: SolutionOutputFolder
    value: $(Build.ArtifactStagingDirectory)/solutions
  - name: ComponentCollectionsSolutionOutputFolder
    value: $(Build.ArtifactStagingDirectory)/component-collections

# ==================== Main Solution Export Variables ====================
# - varSourceEnvironmentURL: Source Power Platform environment URL for main solution
# - varSourceServiceConnection: Service connection for source environment
# - varSolutionName: Internal solution name in Power Platform (e.g., CopilotStudioAccelerator)
# - varOutputSolutionName: Display name for output files (e.g., CopilotStudioKit)

# ==================== Component Collections Export Variables ====================
# - varComponentCollectionsSourceEnvironmentURL: Source Power Platform environment URL for component collections
#   (Can be same as varSourceEnvironmentURL if both solutions are in same environment)
# - varComponentCollectionsSourceServiceConnection: Service connection for component collections source
#   (Can be same as varSourceServiceConnection if both solutions are in same environment)
# - varRunComponentsSolutions: Set to 'true' to export/deploy component collections, 'false' to skip
#   IMPORTANT: This must be set as a pipeline variable in Azure DevOps (not defined in YAML)

# ==================== Deploy Variables ====================
# - varTargetEnvironmentURL: Target Power Platform environment URL (used for all solutions)
# - varTargetServiceConnection: Service connection for target environment (used for all solutions)
# - varSolutionType: 'managed' or 'unmanaged' (applies to all solutions)

# ==================== Internal Test Environment Deploy Variables ====================
# - varRunInternalTestDeployment: Set to 'true' to deploy to internal test environments, 'false' to skip
#   IMPORTANT: This must be set as a pipeline variable in Azure DevOps (not defined in YAML)
# - varInternalTestManagedEnvironmentURL: Target Power Platform environment URL for managed test deployment
# - varInternalTestManagedServiceConnection: Service connection for managed test environment
# - varInternalTestUnmanagedEnvironmentURL: Target Power Platform environment URL for unmanaged test deployment
# - varInternalTestUnmanagedServiceConnection: Service connection for unmanaged test environment

# ==================== Release Variables ====================
# - varReleaseBuild: Set to 'true' to create GitHub release, 'false' to skip
#   IMPORTANT: This must be set as a pipeline variable in Azure DevOps (not defined in YAML)
# - varGitHubConnection: GitHub service connection name
# - varGitHubRepo: GitHub repository (format: owner/repo)
# - varReleaseName: Release name prefix (e.g., CopilotStudioAccelerator)
# - varReleaseMonth: Month name (e.g., January)
# - varReleaseYear: Year (e.g., 2026)
# - varMileStone: (Optional) GitHub milestone name to include issues in release notes
# - varComponentCatalogFolderName: Name of the folder/zip file for component collections catalog (e.g., ComponentCollectionsCatalogue)

stages:
# ============================================================================
# STAGE 1: EXPORT & COMMIT
# ============================================================================
- stage: Export
  displayName: 'Export & Commit Solution'
  jobs:
  - job: ExportJob
    displayName: 'Export Solution'
    steps:
    
    # ========================================================================
    # Install Power Platform Build Tools
    # ========================================================================
    - task: PowerPlatformToolInstaller@2
      displayName: 'Install Power Platform Build Tools'
    
    # ========================================================================
    # Export Unmanaged Solution
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export Unmanaged Solution ($(varOutputSolutionName))'
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varSourceServiceConnection)'
        Environment: '$(varSourceEnvironmentURL)'
        SolutionName: '$(varSolutionName)'
        SolutionOutputFile: '$(SolutionOutputFolder)/$(varOutputSolutionName).zip'
        Managed: false
    
    # ========================================================================
    # Export Managed Solution
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export Managed Solution ($(varOutputSolutionName))'
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varSourceServiceConnection)'
        Environment: '$(varSourceEnvironmentURL)'
        SolutionName: '$(varSolutionName)'
        SolutionOutputFile: '$(SolutionOutputFolder)/$(varOutputSolutionName)_managed.zip'
        Managed: true
    
    # ========================================================================
    # Rename Managed Solution with Date Stamp
    # ========================================================================
    - powershell: |
        $outputSolutionName = "$(varOutputSolutionName)"
        $dateStamp = Get-Date -Format "yyyyMMdd"
        
        $originalFile = "$(SolutionOutputFolder)/${outputSolutionName}_managed.zip"
        $newFileName = "${outputSolutionName}_${dateStamp}_managed.zip"
        $newFile = "$(SolutionOutputFolder)/${newFileName}"
        
        if (Test-Path $originalFile) {
            Rename-Item -Path $originalFile -NewName $newFileName
            Write-Host "##[section]Renamed managed solution with date stamp:"
            Write-Host "  From: ${outputSolutionName}_managed.zip"
            Write-Host "  To:   ${newFileName}"
        } else {
            Write-Host "##vso[task.logissue type=error]Managed solution file not found: $originalFile"
            exit 1
        }
      displayName: 'Rename Managed Solution with Date Stamp ($(varOutputSolutionName))'
    
    # ========================================================================
    # COMPONENT COLLECTIONS EXPORT
    # ========================================================================
    
    # ========================================================================
    # Export CopilotStudioKit_ContentSynth_Component - Unmanaged
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export CopilotStudioKit_ContentSynth_Component - Unmanaged'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varComponentCollectionsSourceServiceConnection)'
        Environment: '$(varComponentCollectionsSourceEnvironmentURL)'
        SolutionName: 'CopilotStudioKit_ContentSynth_Component'
        SolutionOutputFile: '$(ComponentCollectionsSolutionOutputFolder)/CopilotStudioKit_ContentSynth_Component.zip'
        Managed: false
    
    # ========================================================================
    # Export CopilotStudioKit_ContentSynth_Component - Managed
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export CopilotStudioKit_ContentSynth_Component - Managed'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varComponentCollectionsSourceServiceConnection)'
        Environment: '$(varComponentCollectionsSourceEnvironmentURL)'
        SolutionName: 'CopilotStudioKit_ContentSynth_Component'
        SolutionOutputFile: '$(ComponentCollectionsSolutionOutputFolder)/CopilotStudioKit_ContentSynth_Component_managed.zip'
        Managed: true
    
    # ========================================================================
    # Rename CopilotStudioKit_ContentSynth_Component Managed with Date Stamp
    # ========================================================================
    - powershell: |
        $outputSolutionName = "CopilotStudioKit_ContentSynth_Component"
        $dateStamp = Get-Date -Format "yyyyMMdd"
        
        $originalFile = "$(ComponentCollectionsSolutionOutputFolder)/${outputSolutionName}_managed.zip"
        $newFileName = "${outputSolutionName}_${dateStamp}_managed.zip"
        $newFile = "$(ComponentCollectionsSolutionOutputFolder)/${newFileName}"
        
        if (Test-Path $originalFile) {
            Rename-Item -Path $originalFile -NewName $newFileName
            Write-Host "##[section]Renamed managed solution with date stamp:"
            Write-Host "  From: ${outputSolutionName}_managed.zip"
            Write-Host "  To:   ${newFileName}"
        } else {
            Write-Host "##vso[task.logissue type=error]Managed solution file not found: $originalFile"
            exit 1
        }
      displayName: 'Rename CopilotStudioKit_ContentSynth_Component Managed with Date Stamp'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
    
    # ========================================================================
    # Export CopilotStudioKit_Research_Component - Unmanaged
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export CopilotStudioKit_Research_Component - Unmanaged'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varComponentCollectionsSourceServiceConnection)'
        Environment: '$(varComponentCollectionsSourceEnvironmentURL)'
        SolutionName: 'CopilotStudioKit_Research_Component'
        SolutionOutputFile: '$(ComponentCollectionsSolutionOutputFolder)/CopilotStudioKit_Research_Component.zip'
        Managed: false
    
    # ========================================================================
    # Export CopilotStudioKit_Research_Component - Managed
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export CopilotStudioKit_Research_Component - Managed'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varComponentCollectionsSourceServiceConnection)'
        Environment: '$(varComponentCollectionsSourceEnvironmentURL)'
        SolutionName: 'CopilotStudioKit_Research_Component'
        SolutionOutputFile: '$(ComponentCollectionsSolutionOutputFolder)/CopilotStudioKit_Research_Component_managed.zip'
        Managed: true
    
    # ========================================================================
    # Rename CopilotStudioKit_Research_Component Managed with Date Stamp
    # ========================================================================
    - powershell: |
        $outputSolutionName = "CopilotStudioKit_Research_Component"
        $dateStamp = Get-Date -Format "yyyyMMdd"
        
        $originalFile = "$(ComponentCollectionsSolutionOutputFolder)/${outputSolutionName}_managed.zip"
        $newFileName = "${outputSolutionName}_${dateStamp}_managed.zip"
        $newFile = "$(ComponentCollectionsSolutionOutputFolder)/${newFileName}"
        
        if (Test-Path $originalFile) {
            Rename-Item -Path $originalFile -NewName $newFileName
            Write-Host "##[section]Renamed managed solution with date stamp:"
            Write-Host "  From: ${outputSolutionName}_managed.zip"
            Write-Host "  To:   ${newFileName}"
        } else {
            Write-Host "##vso[task.logissue type=error]Managed solution file not found: $originalFile"
            exit 1
        }
      displayName: 'Rename CopilotStudioKit_Research_Component Managed with Date Stamp'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
    
    # ========================================================================
    # Export CopilotStudioKit_ExecBrief_Component - Unmanaged
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export CopilotStudioKit_ExecBrief_Component - Unmanaged'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varComponentCollectionsSourceServiceConnection)'
        Environment: '$(varComponentCollectionsSourceEnvironmentURL)'
        SolutionName: 'CopilotStudioKit_ExecBrief_Component'
        SolutionOutputFile: '$(ComponentCollectionsSolutionOutputFolder)/CopilotStudioKit_ExecBrief_Component.zip'
        Managed: false
    
    # ========================================================================
    # Export CopilotStudioKit_ExecBrief_Component - Managed
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export CopilotStudioKit_ExecBrief_Component - Managed'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varComponentCollectionsSourceServiceConnection)'
        Environment: '$(varComponentCollectionsSourceEnvironmentURL)'
        SolutionName: 'CopilotStudioKit_ExecBrief_Component'
        SolutionOutputFile: '$(ComponentCollectionsSolutionOutputFolder)/CopilotStudioKit_ExecBrief_Component_managed.zip'
        Managed: true
    
    # ========================================================================
    # Rename CopilotStudioKit_ExecBrief_Component Managed with Date Stamp
    # ========================================================================
    - powershell: |
        $outputSolutionName = "CopilotStudioKit_ExecBrief_Component"
        $dateStamp = Get-Date -Format "yyyyMMdd"
        
        $originalFile = "$(ComponentCollectionsSolutionOutputFolder)/${outputSolutionName}_managed.zip"
        $newFileName = "${outputSolutionName}_${dateStamp}_managed.zip"
        $newFile = "$(ComponentCollectionsSolutionOutputFolder)/${newFileName}"
        
        if (Test-Path $originalFile) {
            Rename-Item -Path $originalFile -NewName $newFileName
            Write-Host "##[section]Renamed managed solution with date stamp:"
            Write-Host "  From: ${outputSolutionName}_managed.zip"
            Write-Host "  To:   ${newFileName}"
        } else {
            Write-Host "##vso[task.logissue type=error]Managed solution file not found: $originalFile"
            exit 1
        }
      displayName: 'Rename CopilotStudioKit_ExecBrief_Component Managed with Date Stamp'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
    
    # ========================================================================
    # Export CopilotStudioKit_DocumentExtraction_Component - Unmanaged
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export CopilotStudioKit_DocumentExtraction_Component - Unmanaged'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varComponentCollectionsSourceServiceConnection)'
        Environment: '$(varComponentCollectionsSourceEnvironmentURL)'
        SolutionName: 'CopilotStudioKit_DocumentExtraction_Component'
        SolutionOutputFile: '$(ComponentCollectionsSolutionOutputFolder)/CopilotStudioKit_DocumentExtraction_Component.zip'
        Managed: false
    
    # ========================================================================
    # Export CopilotStudioKit_DocumentExtraction_Component - Managed
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export CopilotStudioKit_DocumentExtraction_Component - Managed'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varComponentCollectionsSourceServiceConnection)'
        Environment: '$(varComponentCollectionsSourceEnvironmentURL)'
        SolutionName: 'CopilotStudioKit_DocumentExtraction_Component'
        SolutionOutputFile: '$(ComponentCollectionsSolutionOutputFolder)/CopilotStudioKit_DocumentExtraction_Component_managed.zip'
        Managed: true
    
    # ========================================================================
    # Rename CopilotStudioKit_DocumentExtraction_Component Managed with Date Stamp
    # ========================================================================
    - powershell: |
        $outputSolutionName = "CopilotStudioKit_DocumentExtraction_Component"
        $dateStamp = Get-Date -Format "yyyyMMdd"
        
        $originalFile = "$(ComponentCollectionsSolutionOutputFolder)/${outputSolutionName}_managed.zip"
        $newFileName = "${outputSolutionName}_${dateStamp}_managed.zip"
        $newFile = "$(ComponentCollectionsSolutionOutputFolder)/${newFileName}"
        
        if (Test-Path $originalFile) {
            Rename-Item -Path $originalFile -NewName $newFileName
            Write-Host "##[section]Renamed managed solution with date stamp:"
            Write-Host "  From: ${outputSolutionName}_managed.zip"
            Write-Host "  To:   ${newFileName}"
        } else {
            Write-Host "##vso[task.logissue type=error]Managed solution file not found: $originalFile"
            exit 1
        }
      displayName: 'Rename CopilotStudioKit_DocumentExtraction_Component Managed with Date Stamp'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
    
    # ========================================================================
    # Export CopilotStudioKit_ServiceNow_Components - Unmanaged
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export CopilotStudioKit_ServiceNow_Components - Unmanaged'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varComponentCollectionsSourceServiceConnection)'
        Environment: '$(varComponentCollectionsSourceEnvironmentURL)'
        SolutionName: 'CopilotStudioKit_ServiceNow_Components'
        SolutionOutputFile: '$(ComponentCollectionsSolutionOutputFolder)/CopilotStudioKit_ServiceNow_Components.zip'
        Managed: false
    
    # ========================================================================
    # Export CopilotStudioKit_ServiceNow_Components - Managed
    # ========================================================================
    - task: PowerPlatformExportSolution@2
      displayName: 'Export CopilotStudioKit_ServiceNow_Components - Managed'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varComponentCollectionsSourceServiceConnection)'
        Environment: '$(varComponentCollectionsSourceEnvironmentURL)'
        SolutionName: 'CopilotStudioKit_ServiceNow_Components'
        SolutionOutputFile: '$(ComponentCollectionsSolutionOutputFolder)/CopilotStudioKit_ServiceNow_Components_managed.zip'
        Managed: true
    
    # ========================================================================
    # Rename CopilotStudioKit_ServiceNow_Components Managed with Date Stamp
    # ========================================================================
    - powershell: |
        $outputSolutionName = "CopilotStudioKit_ServiceNow_Components"
        $dateStamp = Get-Date -Format "yyyyMMdd"
        
        $originalFile = "$(ComponentCollectionsSolutionOutputFolder)/${outputSolutionName}_managed.zip"
        $newFileName = "${outputSolutionName}_${dateStamp}_managed.zip"
        $newFile = "$(ComponentCollectionsSolutionOutputFolder)/${newFileName}"
        
        if (Test-Path $originalFile) {
            Rename-Item -Path $originalFile -NewName $newFileName
            Write-Host "##[section]Renamed managed solution with date stamp:"
            Write-Host "  From: ${outputSolutionName}_managed.zip"
            Write-Host "  To:   ${newFileName}"
        } else {
            Write-Host "##vso[task.logissue type=error]Managed solution file not found: $originalFile"
            exit 1
        }
      displayName: 'Rename CopilotStudioKit_ServiceNow_Components Managed with Date Stamp'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
    
    # ========================================================================
    # Publish Pipeline Artifacts - Main Solution
    # ========================================================================
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Main Solution Artifacts'
      inputs:
        targetPath: '$(SolutionOutputFolder)'
        artifact: 'drop'
        publishLocation: 'pipeline'
    
    # ========================================================================
    # Publish Pipeline Artifacts - Component Collections
    # ========================================================================
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Component Collections Artifacts'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        targetPath: '$(ComponentCollectionsSolutionOutputFolder)'
        artifact: 'component-collections'
        publishLocation: 'pipeline'

# ============================================================================
# STAGE 2: DEPLOY
# ============================================================================
- stage: Deploy
  displayName: 'Deploy Solution'
  dependsOn: Export
  condition: succeeded()
  jobs:
  - job: DeployJob
    displayName: 'Deploy to Target'
    steps:
    
    # ========================================================================
    # Download artifacts from Export stage
    # ========================================================================
    - download: current
      artifact: drop
      displayName: 'Download Main Solution Artifacts'
    
    - download: current
      artifact: component-collections
      displayName: 'Download Component Collections Artifacts'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
    
    # ========================================================================
    # Install Power Platform Build Tools
    # ========================================================================
    - task: PowerPlatformToolInstaller@2
      displayName: 'Install Power Platform Build Tools'
    
    # ========================================================================
    # MAIN SOLUTION DEPLOYMENT
    # ========================================================================
    
    # ========================================================================
    # Determine Solution File Path - Main Solution
    # ========================================================================
    - powershell: |
        $solutionType = "$(varSolutionType)".ToLower()
        $outputSolutionName = "$(varOutputSolutionName)"
        $downloadPath = "$(Pipeline.Workspace)/drop"
        
        if ($solutionType -eq "managed") {
            # Find managed file with date stamp pattern
            $pattern = "${outputSolutionName}_*_managed.zip"
            $managedFiles = Get-ChildItem -Path $downloadPath -Filter $pattern
            
            if ($managedFiles.Count -eq 0) {
                Write-Host "##vso[task.logissue type=error]Managed solution not found with pattern: $pattern"
                Write-Host "Available files in download path:"
                Get-ChildItem -Path $downloadPath | ForEach-Object { Write-Host "  $_" }
                exit 1
            }
            
            $solutionFile = $managedFiles[0].FullName
            Write-Host "##[section]Deploying MANAGED solution: $($managedFiles[0].Name)"
        }
        elseif ($solutionType -eq "unmanaged") {
            $solutionFile = "${downloadPath}/${outputSolutionName}.zip"
            Write-Host "##[section]Deploying UNMANAGED solution: ${outputSolutionName}.zip"
        }
        else {
            Write-Host "##vso[task.logissue type=error]Invalid varSolutionType. Must be 'managed' or 'unmanaged'"
            exit 1
        }
        
        if (-not (Test-Path $solutionFile)) {
            Write-Host "##vso[task.logissue type=error]Solution file not found: $solutionFile"
            Write-Host "Available files in download path:"
            Get-ChildItem -Path $downloadPath | ForEach-Object { Write-Host "  $_" }
            exit 1
        }
        
        Write-Host "##vso[task.setvariable variable=SolutionFilePath]$solutionFile"
        Write-Host "Solution file validated: $solutionFile"
      displayName: 'Determine Solution File Path ($(varOutputSolutionName))'
    
    # ========================================================================
    # Import Solution - Main Solution
    # ========================================================================
    - task: PowerPlatformImportSolution@2
      displayName: 'Import Solution ($(varOutputSolutionName)) - $(varSolutionType)'
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varTargetServiceConnection)'
        Environment: '$(varTargetEnvironmentURL)'
        SolutionInputFile: '$(SolutionFilePath)'
        AsyncOperation: true
        MaxAsyncWaitTime: 60
        UseDeploymentSettingsFile: false
        OverwriteUnmanagedCustomizations: false
        SkipProductUpdateDependencies: false
        ConvertToManaged: false
        HoldingSolution: false
    
    # ========================================================================
    # Publish Customizations (Unmanaged Only) - Main Solution
    # ========================================================================
    - task: PowerPlatformPublishCustomizations@2
      displayName: 'Publish Customizations ($(varOutputSolutionName))'
      condition: eq(variables['varSolutionType'], 'unmanaged')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varTargetServiceConnection)'
        Environment: '$(varTargetEnvironmentURL)'
    
    # ========================================================================
    # COMPONENT COLLECTIONS DEPLOYMENT
    # ========================================================================
    
    # ========================================================================
    # Determine Solution File Path - CopilotStudioKit_ContentSynth_Component
    # ========================================================================
    - powershell: |
        $solutionType = "$(varSolutionType)".ToLower()
        $outputSolutionName = "CopilotStudioKit_ContentSynth_Component"
        $downloadPath = "$(Pipeline.Workspace)/component-collections"
        
        if ($solutionType -eq "managed") {
            # Find managed file with date stamp pattern
            $pattern = "${outputSolutionName}_*_managed.zip"
            $managedFiles = Get-ChildItem -Path $downloadPath -Filter $pattern
            
            if ($managedFiles.Count -eq 0) {
                Write-Host "##vso[task.logissue type=error]Managed solution not found with pattern: $pattern"
                Write-Host "Available files in download path:"
                Get-ChildItem -Path $downloadPath | ForEach-Object { Write-Host "  $_" }
                exit 1
            }
            
            $solutionFile = $managedFiles[0].FullName
            Write-Host "##[section]Deploying MANAGED solution: $($managedFiles[0].Name)"
        }
        elseif ($solutionType -eq "unmanaged") {
            $solutionFile = "${downloadPath}/${outputSolutionName}.zip"
            Write-Host "##[section]Deploying UNMANAGED solution: ${outputSolutionName}.zip"
        }
        else {
            Write-Host "##vso[task.logissue type=error]Invalid varSolutionType. Must be 'managed' or 'unmanaged'"
            exit 1
        }
        
        if (-not (Test-Path $solutionFile)) {
            Write-Host "##vso[task.logissue type=error]Solution file not found: $solutionFile"
            Write-Host "Available files in download path:"
            Get-ChildItem -Path $downloadPath | ForEach-Object { Write-Host "  $_" }
            exit 1
        }
        
        Write-Host "##vso[task.setvariable variable=SolutionFilePath_ContentSynthesizer]$solutionFile"
        Write-Host "Solution file validated: $solutionFile"
      displayName: 'Determine Solution File Path - CopilotStudioKit_ContentSynth_Component'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
    
    # ========================================================================
    # Import Solution - CopilotStudioKit_ContentSynth_Component
    # ========================================================================
    - task: PowerPlatformImportSolution@2
      displayName: 'Import CopilotStudioKit_ContentSynth_Component ($(varSolutionType))'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varTargetServiceConnection)'
        Environment: '$(varTargetEnvironmentURL)'
        SolutionInputFile: '$(SolutionFilePath_ContentSynthesizer)'
        AsyncOperation: true
        MaxAsyncWaitTime: 60
        UseDeploymentSettingsFile: false
        OverwriteUnmanagedCustomizations: false
        SkipProductUpdateDependencies: false
        ConvertToManaged: false
        HoldingSolution: false
    
    # ========================================================================
    # Publish Customizations - CopilotStudioKit_ContentSynth_Component (Unmanaged Only)
    # ========================================================================
    - task: PowerPlatformPublishCustomizations@2
      displayName: 'Publish Customizations - CopilotStudioKit_ContentSynth_Component'
      condition: and(eq(variables['varRunComponentsSolutions'], 'true'), eq(variables['varSolutionType'], 'unmanaged'))
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varTargetServiceConnection)'
        Environment: '$(varTargetEnvironmentURL)'
    
    # ========================================================================
    # Determine Solution File Path - CopilotStudioKit_Research_Component
    # ========================================================================
    - powershell: |
        $solutionType = "$(varSolutionType)".ToLower()
        $outputSolutionName = "CopilotStudioKit_Research_Component"
        $downloadPath = "$(Pipeline.Workspace)/component-collections"
        
        if ($solutionType -eq "managed") {
            # Find managed file with date stamp pattern
            $pattern = "${outputSolutionName}_*_managed.zip"
            $managedFiles = Get-ChildItem -Path $downloadPath -Filter $pattern
            
            if ($managedFiles.Count -eq 0) {
                Write-Host "##vso[task.logissue type=error]Managed solution not found with pattern: $pattern"
                Write-Host "Available files in download path:"
                Get-ChildItem -Path $downloadPath | ForEach-Object { Write-Host "  $_" }
                exit 1
            }
            
            $solutionFile = $managedFiles[0].FullName
            Write-Host "##[section]Deploying MANAGED solution: $($managedFiles[0].Name)"
        }
        elseif ($solutionType -eq "unmanaged") {
            $solutionFile = "${downloadPath}/${outputSolutionName}.zip"
            Write-Host "##[section]Deploying UNMANAGED solution: ${outputSolutionName}.zip"
        }
        else {
            Write-Host "##vso[task.logissue type=error]Invalid varSolutionType. Must be 'managed' or 'unmanaged'"
            exit 1
        }
        
        if (-not (Test-Path $solutionFile)) {
            Write-Host "##vso[task.logissue type=error]Solution file not found: $solutionFile"
            Write-Host "Available files in download path:"
            Get-ChildItem -Path $downloadPath | ForEach-Object { Write-Host "  $_" }
            exit 1
        }
        
        Write-Host "##vso[task.setvariable variable=SolutionFilePath_Research]$solutionFile"
        Write-Host "Solution file validated: $solutionFile"
      displayName: 'Determine Solution File Path - CopilotStudioKit_Research_Component'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
    
    # ========================================================================
    # Import Solution - CopilotStudioKit_Research_Component
    # ========================================================================
    - task: PowerPlatformImportSolution@2
      displayName: 'Import CopilotStudioKit_Research_Component ($(varSolutionType))'
      condition: eq(variables['varRunComponentsSolutions'], 'true')
      inputs:
        authenticationType: 'PowerPlatformSPN'
        PowerPlatformSPN: '$(varTargetServiceConnection)'
        Environment: '$(varTargetEnvironmentURL)'
        SolutionInputFile: '$(SolutionFilePath_Research)'
        AsyncOperation: true
        MaxAsyncWaitTime: 60
        UseDeploymentSettingsFile: false
        OverwriteUnmanagedCustomizations: false
        SkipProductUpdateDependencies: false
        ConvertToManaged: false
        HoldingSolution: false
    
    # ========================================================================
    # Publish Customizations - CopilotStudioKit_Research_Component (Unmanaged Only)
    # ========================================================================
    - task: PowerPlatformPublishCustomizations@2
      displayName: 'Publish Customizations - CopilotStudioKit_Research_Component'
      condition: and(eq(variables['varRunComponentsSolutions'], 'true'), eq(variables['varSolutionType'], 'unmanaged'))
      inputs:
